name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Registry check
        run: npm run registry:check

      - name: Changeset status
        run: npx changeset status --since=main

      - name: Build
        run: bun run build

      - name: Release artifact verification
        run: bun run release:check

      - name: npm pack smoke checks
        run: bun run pack:check

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser (chromium only)
        run: bunx playwright install --with-deps chromium
        working-directory: packages/web-preview

      - name: Run E2E (chromium only)
        run: bunx playwright test --project=chromium
        working-directory: packages/web-preview
