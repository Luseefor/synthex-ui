name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # Only publish from a successful push CI run on main in this repo.
    # workflow_run gates verify + e2e for the exact head_sha before any publish step.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure release git identity
        # push-with-git-cli:true commits with local git config, so set the
        # maintainer identity explicitly instead of the action default bot.
        run: |
          git config user.name "Luseefor"
          git config user.email "sapanakosansar18@gmail.com"
          test "$(git config user.name)" = "Luseefor"
          test "$(git config user.email)" = "sapanakosansar18@gmail.com"
          git var GIT_AUTHOR_IDENT
          git var GIT_COMMITTER_IDENT

      - name: Registry check
        run: npm run registry:check

      - name: Build release artifacts
        run: bun run build

      - name: Release artifact verification
        run: bun run release:check

      - name: npm pack smoke checks
        run: bun run pack:check

      - name: Guard release freshness
        id: fresh
        # v2 prepareBranch resets to context.sha, so fail unless the run
        # context matches the triggering head_sha; skip (green) when main
        # has advanced past the CI-gated SHA instead of publishing stale code.
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.sha }}" != "$HEAD_SHA" ]; then
            echo "context sha (${{ github.sha }}) != triggering head_sha ($HEAD_SHA); refusing to version/publish against a reset base"
            exit 1
          fi
          MAIN_TIP="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$MAIN_TIP" ]; then
            echo "could not resolve origin refs/heads/main"
            exit 1
          fi
          if [ "$MAIN_TIP" != "$HEAD_SHA" ]; then
            echo "main has advanced ($MAIN_TIP != $HEAD_SHA); skipping stale release"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release PR or Publish
        if: steps.fresh.outputs.fresh == 'true'
        uses: changesets/action@v2
        with:
          version-script: node ./scripts/version-packages.mjs
          publish-script: bunx changeset publish
          commit-message: Version Packages
          pr-title: Version Packages
          pr-base-branch: main
          push-with-git-cli: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
